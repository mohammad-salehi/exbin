version: '3'
services:
  panta_front:
    image: ${IMAGE_NAME}
    container_name: panta_front
    ports:
      - "4000:4173"
    environment:
      - PORT=4173
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "10"
    restart: always
