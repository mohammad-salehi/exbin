stages:
  - build
  - deploy

variables:
  FRONT_VERSION: v4.21.1
  GIT_SSL_NO_VERIFY: "true"       # temporary workaround for expired server certs
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

build_front:
  stage: build
  image: docker
  variables:
    # Use your project registry directly (no extra /exbin suffix)
    IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script: 
    - echo $IMAGE_NAME
    - docker build . -f Dockerfile --tag $IMAGE_NAME
    - docker push $IMAGE_NAME
  tags:
    - app2
  only:
    - tags

build_front_dev:
  stage: build
  image: docker
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo $IMAGE_NAME
    - docker build . -f Dockerfile --tag $IMAGE_NAME --build-arg NODE_ENV=development
    - docker push $IMAGE_NAME
  tags:
    - app2
  only:
    refs:
      - development

deploy_front:
  stage: deploy
  needs: [ ]
  image: docker
  only:
    changes:
      - .env.production      # was `.env`; use the actual prod file you rely on
      - .gitlab-ci.yml
      - docker-compose.yml
    refs:
      - main                 # was `master`; your repo shows main
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE:$FRONT_VERSION
    PROJECT_ENV_FILE: .env.production
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo $IMAGE_NAME
    - docker pull $IMAGE_NAME
    - docker-compose -f docker-compose.yml up -d
    # - docker exec -i panta_front bash -c "export NODE_OPTIONS='--max-old-space-size=8192' && npm run build && npm run preview"
  tags:
    - app2
  when: manual

deploy_front_dev:
  stage: deploy
  image: docker
  only:
    refs:
      - development
  variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    PROJECT_ENV_FILE: .env.development
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo $IMAGE_NAME
    - docker pull $IMAGE_NAME
    - docker-compose -f docker-compose.yml up -d
    # - docker exec -i panta_front bash -c "export NODE_OPTIONS='--max-old-space-size=8192' && npm run build && npm run preview"
  tags:
    - app2
